<script>
function bcNorm(s){return (s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();}
function bcB64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function bcOpen(blob,pass){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(bcNorm(pass)),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bcB64(blob.s),iterations:300000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bcB64(blob.i)},key,bcB64(blob.c));
  return new TextDecoder().decode(pt);
}
function bcGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function bcSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function bcDel(k){try{localStorage.removeItem(k)}catch(e){}}

function show(tab){
  var t=D.tabs[tab]?tab:'delete';
  var m='';for(var k in D.tabs){m+='<a href="#'+k+'" class="'+(k===t?'on':'')+'">'+D.tabs[k][0]+'</a>';}
  m+='<a href="../index.html">返回论坛</a>';
  var body=D.tabs[t][1];
  if(t==='drafts'){body='<div class="dmeta">收件人：纸鸢　保存时间：2009-9-1 23:58　状态：未发送</div><form id="df" style="padding:16px" autocomplete="off"><p style="margin:0 0 8px">草稿箱已加密，请输入密码。</p><input id="dp" type="password" style="font:inherit;padding:3px 6px;border:1px solid var(--line);background:var(--box);color:var(--ink)"> <button class="btn" type="submit">打开</button><p id="de" role="alert" style="color:#B3261E;margin:8px 0 0;min-height:1em"></p></form><div id="dl"></div>';}
  document.getElementById('app').innerHTML='<div class="adm"><div class="menu">'+m+'</div><div class="box" style="margin:0"><div class="bh"><h1>'+D.tabs[t][0]+'</h1></div>'+body+'</div></div>';
  if(t==='drafts')bindDraft();
}
function bindDraft(){
  var f=document.getElementById('df'),e=document.getElementById('de'),p=document.getElementById('dp');
  p.addEventListener('input',function(){e.textContent='';});
  async function open(v,quiet){try{var h=await bcOpen(JSON.parse(D.draft),v);bcSet('beichuang.draft',v);f.style.display='none';document.getElementById('dl').innerHTML=h;watchEnd();return true;}catch(x){if(!quiet)e.textContent='密码错误。';return false;}}
  f.addEventListener('submit',function(ev){ev.preventDefault();if(!bcNorm(p.value)){e.textContent='请输入密码。';return;}e.textContent='验证中……';open(p.value);});
  var s=bcGet('beichuang.draft');if(s)open(s,true);
}
function watchEnd(){
  var end=document.getElementById('letter-end'),timer=null,done=false;
  if(!end||!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(en){
    if(en.isIntersecting&&!done){timer=setTimeout(kick,10000);}else{clearTimeout(timer);}
  });});
  io.observe(end);
  function kick(){if(done)return;done=true;io.disconnect();
    if(!bcGet('beichuang.epilogue'))bcSet('beichuang.epilogue',new Date().toISOString());
    var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt"><div class="bh"><h2 id="dt">提示信息</h2></div><p>您的账号已在其他地方登录，您已被迫下线。</p><div class="act"><button class="btn" id="ok" type="button">确定</button></div></div>';
    document.body.appendChild(m);var ok=document.getElementById('ok');ok.focus();
    ok.addEventListener('click',function(){bcDel('beichuang.admin');location.href='../index.html';});
  }
}
async function login(u,p,quiet){
  try{var t=await bcOpen(ADMIN,u+':'+p);D=JSON.parse(t);bcSet('beichuang.admin',u+':'+p);bcSet('beichuang.k0317',D.k0317);
    document.getElementById('login').style.display='none';document.getElementById('who').textContent='ayuan（管理员）';show(location.hash.slice(1));return true;}
  catch(x){if(!quiet)document.getElementById('le').textContent='用户名或密码错误。';return false;}
}
['u','pw'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){document.getElementById('le').textContent='';});});
document.getElementById('lf').addEventListener('submit',function(ev){ev.preventDefault();var u=document.getElementById('u').value,p=document.getElementById('pw').value;
  if(!bcNorm(u)||!bcNorm(p)){document.getElementById('le').textContent='请输入用户名和密码。';return;}document.getElementById('le').textContent='登录中……';login(u,p);});
window.addEventListener('hashchange',function(){if(D)show(location.hash.slice(1));});
var s=bcGet('beichuang.admin');if(s){var i=s.indexOf(':');login(s.slice(0,i),s.slice(i+1),true);}
</script></body></html>
